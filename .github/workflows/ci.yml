name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 讀卡（pyscard）與 Qt PDF／列印元件以 Windows 為準，和使用者環境一致
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          # ddddocr 的宣告會拉進非 headless 的 opencv-python，與 PySide6 衝突
          python -m pip install --disable-pip-version-check --no-deps ddddocr==1.6.1
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider
