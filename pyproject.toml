[build-system]
requires = ["setuptools>=77"]       # 77 起支援 SPDX 字串的 license 欄位
build-backend = "setuptools.build_meta"

[project]
name = "icope-tool"
version = "1.1.0"
description = "ICOPE 小幫手（IcopeTool）：國健署長者功能評估年度查詢、轉介資源與衛教單管理的桌面工具"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
# 版本釘死：安裝請用 requirements.txt（ddddocr 需 --no-deps，見 packaging/build_windows.ps1）
dependencies = [
    "PySide6==6.11.2",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "onnxruntime==1.30.0",
    "opencv-python-headless==5.0.0.93",
    "fpdf2==2.8.8",
    "pypdf==6.19.0",
    "openpyxl==3.1.5",
    "pyscard==2.3.1",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-qt==4.5.0", "pyinstaller==6.22.3"]

[project.gui-scripts]
icope-tool = "icope_tool.app:main"

[tool.setuptools.packages.find]
include = ["icope_tool*"]

[tool.setuptools.package-data]
icope_tool = ["resources/**/*", "services/pdf/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
